name = "cloudflare-effect-better-auth"
main = "src/index.ts"
compatibility_date = "2025-01-17"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# D1 Database bindings will be configured here
# [[d1_databases]]
# binding = "DB"
# database_name = "cloudflare-effect-better-auth"
# database_id = "YOUR_DATABASE_ID"

# Secrets (set via: wrangler secret put SECRET_NAME)
# For local development, use .dev.vars file (already in .gitignore)
#
# Required secrets:
# - BETTER_AUTH_SECRET
# - BETTER_AUTH_URL
